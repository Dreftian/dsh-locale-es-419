<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#0b0e14; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="selectedRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bgGlow2)" rx="12"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="900" height="42" fill="#131720" rx="12" />
  <rect x="0" y="30" width="900" height="12" fill="#131720" />
  <line x1="0" y1="42" x2="900" y2="42" stroke="#1f2533" stroke-width="1"/>
  
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="85" y="25" fill="#64748b" font-size="12" font-weight="500">DeepSeek Harness — Settings &gt; General &gt; Language</text>

  <!-- Sidebar Mock -->
  <rect x="0" y="42" width="220" height="478" fill="#0f131a" />
  <line x1="220" y1="42" x2="220" y2="520" stroke="#1f2533" stroke-width="1"/>
  
  <text x="24" y="80" fill="#94a3b8" font-size="12" font-weight="600">SETTINGS</text>
  
  <!-- General Nav item (Active) -->
  <rect x="16" y="96" width="188" height="36" rx="6" fill="#1e293b"/>
  <text x="32" y="119" fill="#38bdf8" font-size="13" font-weight="600">⚙️ General</text>
  
  <!-- Other Nav items -->
  <text x="32" y="160" fill="#64748b" font-size="13">🤖 Models</text>
  <text x="32" y="196" fill="#64748b" font-size="13">🔌 Plugins</text>
  <text x="32" y="232" fill="#64748b" font-size="13">💻 Shell &amp; Terminal</text>
  <text x="32" y="268" fill="#64748b" font-size="13">🛡️ Permissions</text>

  <!-- Main Settings Panel Content -->
  <text x="260" y="88" fill="#f8fafc" font-size="22" font-weight="700">General Settings</text>
  <text x="260" y="110" fill="#64748b" font-size="13">Customize your harness interface language and environment preferences.</text>

  <!-- Settings Card: Language Section -->
  <g filter="url(#shadow2)">
    <rect x="260" y="135" width="580" height="240" rx="12" fill="#161b26" stroke="#262f40" stroke-width="1"/>
    
    <!-- Row: Language Selector Header -->
    <text x="284" y="170" fill="#f1f5f9" font-size="15" font-weight="600">Language / Idioma</text>
    <text x="284" y="190" fill="#94a3b8" font-size="12">Select your interface display language. Changes take effect immediately.</text>

    <!-- Language Options Container -->
    <rect x="284" y="210" width="532" height="140" rx="8" fill="#0d1117" stroke="#1f293d" stroke-width="1"/>

    <!-- Option 1: English -->
    <rect x="285" y="211" width="530" height="42" fill="transparent"/>
    <circle cx="310" cy="232" r="6" stroke="#475569" stroke-width="2" fill="none"/>
    <text x="330" y="236" fill="#cbd5e1" font-size="13">English</text>
    <line x1="285" y1="253" x2="815" y2="253" stroke="#1e2536" stroke-width="1"/>

    <!-- Option 2: Español (Latinoamérica) - SELECTED -->
    <rect x="285" y="254" width="530" height="46" fill="#132338"/>
    <circle cx="310" cy="277" r="6" stroke="#38bdf8" stroke-width="2" fill="#38bdf8"/>
    <circle cx="310" cy="277" r="2.5" fill="#ffffff"/>
    <text x="330" y="281" fill="#38bdf8" font-size="14" font-weight="700">Español (Latinoamérica)</text>
    <rect x="520" y="269" width="65" height="18" rx="4" fill="#0369a1"/>
    <text x="552" y="282" fill="#e0f2fe" font-size="10" font-weight="700" text-anchor="middle">es-419</text>
    <text x="750" y="281" fill="#10b981" font-size="13" font-weight="700">✓ Activo</text>
    <line x1="285" y1="300" x2="815" y2="300" stroke="#1e2536" stroke-width="1"/>

    <!-- Option 3: 中文 -->
    <rect x="285" y="301" width="530" height="42" fill="transparent"/>
    <circle cx="310" cy="322" r="6" stroke="#475569" stroke-width="2" fill="none"/>
    <text x="330" y="326" fill="#cbd5e1" font-size="13">中文 (简体)</text>
  </g>

  <!-- Success Notification Pill -->
  <g transform="translate(260, 400)" filter="url(#glow2)">
    <rect x="0" y="0" width="580" height="48" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="24" y="29" fill="#34d399" font-size="16">🎉</text>
    <text x="54" y="29" fill="#ecfdf5" font-size="13" font-weight="600">¡Listo! La interfaz se actualiza a Español de forma inmediata y automática.</text>
  </g>

  <!-- Step 3 Callout Badge -->
  <g transform="translate(48, 320)">
    <rect x="0" y="0" width="160" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="20" fill="#38bdf8" font-size="11" font-weight="800">PASO 3</text>
    <text x="12" y="36" fill="#e2e8f0" font-size="11">Abre Settings → General</text>
  </g>

  <!-- Step 4 Callout Badge -->
  <g transform="translate(685, 230)">
    <rect x="0" y="0" width="190" height="48" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="20" fill="#34d399" font-size="11" font-weight="800">PASO 4</text>
    <text x="14" y="36" fill="#e2e8f0" font-size="11">Elige Español (Latam)</text>
  </g>
</svg>
