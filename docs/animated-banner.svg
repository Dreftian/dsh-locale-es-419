<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%" style="background:#07090e; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes floatBeam {
      0% { transform: translateX(-100px); }
      100% { transform: translateX(1100px); }
    }
    @keyframes dotGlow {
      0%, 100% { r: 2; opacity: 0.3; }
      50% { r: 3.5; opacity: 0.9; }
    }
    .neon-title { font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
    .badge-label { font-size: 11px; font-weight: 700; fill: #e0f2fe; }
    .glow-dot { fill: #38bdf8; animation: dotGlow 2.5s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1000" height="240" fill="url(#cyberGrad)" rx="12"/>

  <!-- Cyber Grid background decorative lines -->
  <g stroke="#1e293b" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="600" y1="0" x2="600" y2="240"/>
    <line x1="750" y1="0" x2="750" y2="240"/>
    <line x1="900" y1="0" x2="900" y2="240"/>
  </g>

  <!-- Animated Glowing Dots -->
  <circle cx="150" cy="80" class="glow-dot" style="animation-delay: 0s;"/>
  <circle cx="450" cy="160" class="glow-dot" style="animation-delay: 0.8s;"/>
  <circle cx="750" cy="40" class="glow-dot" style="animation-delay: 1.4s;"/>
  <circle cx="900" cy="120" class="glow-dot" style="animation-delay: 0.4s;"/>

  <!-- Glowing Laser Scanline across banner -->
  <line x1="0" y1="238" x2="1000" y2="238" stroke="url(#neonText)" stroke-width="2"/>

  <!-- Badge / Brand Tag -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#0369a1" opacity="0.35"/>
    <rect x="0" y="0" width="135" height="24" rx="12" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="0.5">DSH PLUGIN</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="104" fill="url(#neonText)" class="neon-title">DeepSeek Harness</text>
  <text x="390" y="104" fill="#f8fafc" class="neon-title" font-weight="300">| Español Latinoamérica</text>

  <!-- Subtitle -->
  <text x="60" y="136" fill="#94a3b8" font-size="15" font-weight="400">
    Paquete oficial de idioma de la comunidad (<tspan fill="#38bdf8" font-weight="600">es-419</tspan>) para Web y Desktop App.
  </text>

  <!-- Badges Row -->
  <g transform="translate(60, 168)">
    <!-- Badge 1: BCP 47 -->
    <rect x="0" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="18" fill="#94a3b8" font-size="11">Standard: <tspan fill="#38bdf8" font-weight="700">es-419</tspan></text>

    <!-- Badge 2: Namespaces -->
    <rect x="135" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="149" y="18" fill="#94a3b8" font-size="11">Cobertura: <tspan fill="#34d399" font-weight="700">58 Módulos</tspan></text>

    <!-- Badge 3: Fallback -->
    <rect x="290" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="304" y="18" fill="#94a3b8" font-size="11">Fallback Seguro: <tspan fill="#f59e0b" font-weight="700">English</tspan></text>

    <!-- Badge 4: Zero Config -->
    <rect x="465" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="479" y="18" fill="#94a3b8" font-size="11">Instalación: <tspan fill="#a78bfa" font-weight="700">1 Clic / URL</tspan></text>
  </g>

  <!-- Right Decorative Icon / Emblem -->
  <g transform="translate(860, 100)" opacity="0.85">
    <circle cx="0" cy="0" r="48" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="8" fill="#38bdf8" font-size="22" font-weight="900" text-anchor="middle">ES</text>
  </g>
</svg>
