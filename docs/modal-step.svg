<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#0b0e14; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="calloutGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bgGlow)" rx="12"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="900" height="42" fill="#131720" rx="12" />
  <rect x="0" y="30" width="900" height="12" fill="#131720" />
  <line x1="0" y1="42" x2="900" y2="42" stroke="#1f2533" stroke-width="1"/>
  
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="85" y="25" fill="#64748b" font-size="12" font-weight="500">DeepSeek Harness — Plugins &gt; Add plugin</text>

  <!-- Background App Mock -->
  <text x="40" y="85" fill="#f8fafc" font-size="20" font-weight="700">Plugins</text>
  <text x="40" y="106" fill="#64748b" font-size="13">Install, enable, and configure plugins</text>

  <!-- Modal Backdrop Overlay -->
  <rect x="0" y="42" width="900" height="478" fill="#000000" opacity="0.65"/>

  <!-- Modal Window -->
  <g filter="url(#shadow)">
    <rect x="180" y="80" width="540" height="380" rx="16" fill="#161b26" stroke="#262f40" stroke-width="1"/>
    
    <!-- Modal Title & Close -->
    <text x="210" y="122" fill="#f1f5f9" font-size="18" font-weight="700">Add plugin</text>
    <text x="685" y="120" fill="#64748b" font-size="18" font-weight="400" cursor="pointer">✕</text>

    <!-- Modal Subtitle -->
    <text x="210" y="152" fill="#94a3b8" font-size="13">Enter the plugin's package name, GitHub repository address,</text>
    <text x="210" y="170" fill="#94a3b8" font-size="13">or local directory path.</text>

    <!-- Input Field (Active State) -->
    <rect x="210" y="196" width="480" height="46" rx="8" fill="#0d1117" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="226" y="225" fill="#38bdf8" font-size="14" font-family="'JetBrains Mono', Consolas, monospace" font-weight="500">https://github.com/Dreftian/dsh-locale-es-419</text>
    
    <!-- Animated Cursor Indicator -->
    <rect x="635" y="210" width="2" height="18" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Sub-options row -->
    <text x="210" y="272" fill="#64748b" font-size="12">▾ Install guide and examples</text>
    <text x="540" y="272" fill="#64748b" font-size="12">Registry <tspan fill="#cbd5e1" font-weight="600">Official npm registry ▾</tspan></text>

    <!-- Warning Notice Box -->
    <rect x="210" y="295" width="480" height="74" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" opacity="0.85"/>
    <text x="224" y="318" fill="#fbbf24" font-size="13">ⓘ</text>
    <text x="244" y="318" fill="#d97706" font-size="11" font-weight="600">Install only plugins you trust: they run with your permissions.</text>
    <text x="224" y="338" fill="#a8a29e" font-size="11">Once installed, Español (Latinoamérica) will be available in</text>
    <text x="224" y="354" fill="#a8a29e" font-size="11">Settings → General → Language.</text>

    <!-- Install Button (Ready to Click) -->
    <rect x="210" y="388" width="480" height="42" rx="8" fill="url(#primaryBtn)" cursor="pointer"/>
    <text x="430" y="414" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Install</text>
  </g>

  <!-- Step 1 Callout Badge -->
  <g transform="translate(685, 175)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow)"/>
    <text x="14" y="22" fill="#38bdf8" font-size="12" font-weight="800">PASO 1</text>
    <text x="14" y="38" fill="#e2e8f0" font-size="11">Pega la URL de GitHub</text>
    <path d="M 0 24 L -15 24" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Step 2 Callout Badge -->
  <g transform="translate(685, 385)">
    <rect x="0" y="0" width="180" height="48" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
    <text x="14" y="22" fill="#60a5fa" font-size="12" font-weight="800">PASO 2</text>
    <text x="14" y="38" fill="#e2e8f0" font-size="11">Presiona "Install"</text>
    <path d="M 0 24 L -15 24" stroke="#3b82f6" stroke-width="2"/>
  </g>
</svg>
